name: update-algo-viz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"  # diariamente (UTC). Ajuste se desejar.
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-algo-viz.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate SVGs
        run: |
          python scripts/gen_kmeans_svg.py
          python scripts/gen_astar_svg.py

      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update algorithm visualizations"
          file_pattern: "assets/*.svg"