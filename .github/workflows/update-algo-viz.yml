name: update-algo-viz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: ["main"]
    paths:
      - "scripts/**"
      - "requirements.txt"
      - ".github/workflows/update-algo-viz.yml"

concurrency:
  group: update-algo-viz
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with origin/main
        run: |
          git fetch origin main
          git checkout main
          git reset --hard origin/main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate visualizations
        run: |
          python scripts/gen_kmeans_gif.py
          python scripts/gen_astar_gif.py
          python scripts/gen_perceptron_gif.py
          python scripts/gen_gradient_descent_gif.py
          python scripts/gen_ga_gif.py
          python scripts/gen_decision_tree_gif.py
          python scripts/gen_som_gif.py
          python scripts/gen_naive_bayes_gif.py
          python scripts/gen_svm_gif.py
          
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update algorithm visualizations"
          file_pattern: "assets/*.gif"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}