    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#b4dfcf" stroke-opacity=".065"/></pattern>
    <clipPath id="clip"><rect width="1200" height="420" rx="4"/></clipPath>
